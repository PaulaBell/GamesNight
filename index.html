<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Game Night</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--accent:#e94560;--gold:#f5a623;--green:#0f9b58;--blue:#4cc9f0;--purple:#7b2fff;--text:#f0f0f0;--muted:#777;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
#app{min-height:100vh}
.screen{display:flex;flex-direction:column;align-items:center;padding:1.2rem 1rem 2.5rem;gap:.85rem;width:100%;min-height:100vh}
.w500{width:100%;max-width:500px}
.title{font-size:2.4rem;font-weight:900;text-align:center;letter-spacing:-.02em}
.title-gn{background:linear-gradient(135deg,#7b2fff,#4cc9f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.title-y{background:linear-gradient(135deg,#0f9b58,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.title-s{background:linear-gradient(135deg,#e94560,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.muted{color:var(--muted);font-size:.82rem;text-align:center;font-weight:600}
.badge{background:rgba(255,255,255,.07);border-radius:20px;padding:.25rem .8rem;font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.card{background:var(--card);border-radius:var(--r);padding:1.1rem;width:100%;max-width:500px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.btn{display:block;width:100%;max-width:500px;padding:.85rem 1.5rem;border:none;border-radius:10px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;letter-spacing:.02em;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.97);opacity:.9}
.btn-purple{background:var(--purple);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--accent);color:#fff}
.btn-gold{background:var(--gold);color:#1a0f00}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text)}
input{width:100%;padding:.75rem 1rem;border-radius:8px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
label{font-size:.7rem;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;display:block}
.flash{color:var(--accent);font-size:.82rem;text-align:center;font-weight:700;min-height:1rem;transition:opacity .3s}
.back-btn{align-self:flex-start;background:rgba(255,255,255,.07);border:none;border-radius:8px;padding:.4rem .85rem;color:var(--muted);font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:800;cursor:pointer}
.game-tile{width:100%;max-width:500px;border-radius:16px;padding:1.3rem 1.3rem 1.3rem 1.3rem;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.game-tile:active{transform:scale(.98)}
.tile-y{background:linear-gradient(135deg,#0a2e14,#1a3a00)}
.tile-s{background:linear-gradient(135deg,#2e0a14,#1a002a)}
.tile-fc{background:linear-gradient(135deg,#1a0a3a,#0a1a2e)}
.tile-qk{background:linear-gradient(135deg,#0a2a3a,#001a2a)}
.tile-fb{background:linear-gradient(135deg,#2a0a3a,#1a002a)}
.tile-icon{font-size:2.2rem;margin-bottom:.35rem}
.tile-name{font-size:1.35rem;font-weight:900;margin-bottom:.2rem}
.tile-desc{font-size:.73rem;color:rgba(255,255,255,.5);font-weight:600;line-height:1.4}
.tile-arrow{position:absolute;right:1.1rem;top:50%;transform:translateY(-50%);font-size:1.5rem;opacity:.4}
.code-box{font-size:2.8rem;font-weight:900;letter-spacing:.25em;color:var(--gold);text-align:center;background:rgba(245,166,35,.1);border-radius:10px;padding:.4rem 1rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.07);border-radius:20px;padding:.35rem .75rem;font-size:.82rem;font-weight:700;margin:.2rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
/* YAHTZEE TABLE */
.y-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.y-table{border-collapse:collapse;background:#fffdf5}
.y-thead th{background:#1a3a1a;color:#f5e9c8;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:.45rem .4rem;font-weight:800;white-space:nowrap;position:sticky;top:0;z-index:5;text-align:center}
.y-thead th.sticky-col{position:sticky;left:0;z-index:10;text-align:left;padding-left:.7rem;min-width:125px}
.y-cat-td{position:sticky;left:0;background:#fffdf5;z-index:3;padding:0 .6rem 0 .7rem;height:38px;border-right:2px solid rgba(181,144,58,.3);min-width:125px}
.y-score-td{height:38px;text-align:center;border-right:1px solid rgba(181,144,58,.2);padding:0;min-width:72px;max-width:90px}
.y-sec-row td{background:#2d5a2d;color:#f5e9c8;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;padding:.35rem .6rem;font-weight:800}
.y-sec-row td.sticky-col{position:sticky;left:0;z-index:3}
.y-alt{background:rgba(181,144,58,.06)}
.y-alt .y-cat-td{background:rgba(252,244,215,.5)}
.y-sub td{background:rgba(181,144,58,.12)}
.y-sub .y-cat-td{background:rgba(248,235,195,.8)}
.y-bonus td{background:rgba(40,80,40,.08)}
.y-bonus .y-cat-td{background:rgba(240,248,240,.8)}
.y-grand td{background:#2d5a2d}
.y-grand .y-cat-td{background:#2d5a2d;color:#f5e9c8}
.y-cat-name{font-size:.78rem;font-weight:700;color:#2d1a00;white-space:nowrap}
.y-cat-desc{font-size:.58rem;color:#7a5c2a}
.y-grand-name{font-size:.75rem;font-weight:800;color:#f5e9c8;text-transform:uppercase;letter-spacing:.06em}
.cell-tap{width:100%;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.88rem;font-weight:700;transition:background .12s;user-select:none}
.cell-tap.can:hover{background:rgba(181,144,58,.18)}
.cell-tap.ro{cursor:default}
.cell-tap.scored{color:#2d1a00}
.cell-tap.scratched{color:#c0392b}
.cell-tap.empty{color:#bbb}
.cell-tap.grand-val{font-size:1.05rem;font-weight:900;color:#f5e9c8;height:38px}
.cell-tap.leader-col{background:#b5903a!important}
.cell-tap.leader-col.grand-val{color:#fff!important}
.leader-star{font-size:.55rem;display:block;color:#fff;text-align:center;margin-top:-6px;padding-bottom:2px}
/* POPUP */
.popup-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:1rem}
.popup-bx{background:#fffdf5;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.6);padding:1.2rem;width:100%;max-width:285px}
.popup-ttl{font-size:1rem;font-weight:900;color:#2d1a00;margin-bottom:.15rem}
.popup-dsc{font-size:.67rem;color:#7a5c2a;margin-bottom:.85rem}
.popup-grid{display:grid;gap:5px;margin-bottom:.7rem}
.p-btn{border:1px solid rgba(181,144,58,.4);background:transparent;color:#2d1a00;padding:7px 3px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.84rem;font-weight:700;border-radius:4px;transition:all .15s;text-align:center;width:100%}
.p-btn:hover,.p-btn.sel{background:#2d5a2d;color:#f5e9c8;border-color:#2d5a2d}
.p-btn.sc{color:#c0392b;border-color:rgba(192,57,43,.35)}
.p-btn.sc:hover,.p-btn.sc.sel{background:#c0392b;color:#fff;border-color:#c0392b}
.p-cancel{width:100%;padding:.4rem;background:transparent;border:1px solid rgba(181,144,58,.3);color:#9a7a4a;font-family:'Nunito',sans-serif;font-size:.72rem;cursor:pointer;border-radius:4px;letter-spacing:.08em;text-transform:uppercase;margin-top:.3rem}
/* SCATTERGORIES */
.timer{font-size:2rem;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.timer.urgent{color:var(--accent);animation:pulse .5s ease infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.4}}
.letter-big{font-size:5.5rem;font-weight:900;line-height:1;text-align:center;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.cat-row{display:flex;align-items:center;gap:.4rem;padding:.38rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.cat-row:last-child{border-bottom:none}
.cat-num{font-size:.65rem;font-weight:900;color:var(--accent);width:1.2rem;flex-shrink:0}
.cat-lbl{font-size:.75rem;font-weight:700;color:var(--muted);width:100px;flex-shrink:0;line-height:1.2}
.cat-inp{flex:1;padding:.45rem .6rem;font-size:.88rem;border-radius:6px}
.vote-row{display:flex;align-items:center;gap:.5rem;padding:.52rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.vote-row:last-child{border-bottom:none}
.vote-left{flex:1;min-width:0}
.vnm{font-size:.65rem;color:var(--muted);font-weight:700}
.vans{font-size:.9rem;font-weight:800;word-break:break-word}
.vbtn{border:none;border-radius:7px;padding:.42rem .58rem;cursor:pointer;font-size:.9rem;font-weight:800;transition:transform .1s,background .15s;background:rgba(255,255,255,.08)}
.vbtn:active{transform:scale(.9)}
.vbtn.acc{background:rgba(15,155,88,.25);color:#5eff9e}.vbtn.acc.on{background:var(--green);color:#fff}
.vbtn.rej{background:rgba(233,69,96,.2);color:#ff8fa3}.vbtn.rej.on{background:var(--accent);color:#fff}
.vbtn.bon{background:rgba(245,166,35,.18);color:var(--gold)}.vbtn.bon.on{background:var(--gold);color:#1a0f00}
.dup-tag{font-size:.58rem;background:rgba(245,166,35,.15);color:var(--gold);border-radius:3px;padding:.08rem .25rem;font-weight:800;margin-left:.25rem}
.sc-score-row{display:flex;align-items:center;justify-content:space-between;padding:.52rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.sc-score-row:last-child{border-bottom:none}
.sc-pts{font-weight:900;font-size:1.05rem;color:var(--gold)}
.crwn{display:inline-block;background:var(--gold);color:#1a0f00;border-radius:4px;padding:.04rem .3rem;font-size:.58rem;font-weight:900;margin-left:.3rem;vertical-align:middle}
.mode-sel{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%;max-width:500px}
.mode-btn{border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:10px;padding:.85rem .5rem;cursor:pointer;font-family:'Nunito',sans-serif;text-align:center;transition:all .15s}
.mode-btn.active{border-color:var(--green);background:rgba(15,155,88,.15)}
.mode-btn .mi{font-size:1.5rem;margin-bottom:.3rem}
.mode-btn .mt{font-size:.82rem;font-weight:800;color:var(--text)}
.mode-btn .md{font-size:.68rem;color:var(--muted);margin-top:.15rem}
</style>
</head>
<body>
<div id="app"><div class="screen"><p class="muted" style="margin-top:3rem">Loading...</p></div></div>
<script>
// ═══════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════
firebase.initializeApp({
  apiKey:"AIzaSyDEtYrWQYBwPoKM8tUDeXTXhwSU3SXcsYI",
  authDomain:"games-night-23.firebaseapp.com",
  databaseURL:"https://games-night-23-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"games-night-23",
  storageBucket:"games-night-23.firebasestorage.app",
  messagingSenderId:"440548124532",
  appId:"1:440548124532:web:a254a84a8a2214201a6e21"
});
const db = firebase.database();

// ═══════════════════════════════════════════════
// SHARED
// ═══════════════════════════════════════════════
const PID = localStorage.getItem('gn_pid') || ('p_'+Date.now().toString(36));
localStorage.setItem('gn_pid', PID);
let STORED_NAME = localStorage.getItem('gn_name') || '';

function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function $id(id){return document.getElementById(id)}
function val(id){return ($id(id)?.value||'').trim()}
function rndCode(){return Math.random().toString(36).substr(2,4).toUpperCase()}
function pick(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}

let gameListener = null;
function stopListening(){if(gameListener){gameListener();gameListener=null;}}
function listenTo(ref, fn){
  stopListening();
  ref.on('value', fn);
  gameListener = () => ref.off('value', fn);
}

// ═══════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════
let A = { screen:'hub' }; // hub, y_setup, y_lobby, y_game, s_setup, s_lobby, s_spin, s_answer, s_vote, s_end, s_over

// ─── YAHTZEE STATE ───
let Y = {
  roomCode:null, playerName:'', isHost:false, isScorer:false,
  mode:'own', game:null, popup:null, numpadDraft:'', addingPlayer:false
};

// ─── SCATTERGORIES STATE ───
let S = {
  roomCode:null, playerName:'', isHost:false, game:null,
  submitted:false, timerInt:null, localVotes:{}, localAnswers:{}
};

// ═══════════════════════════════════════════════
// YAHTZEE DATA
// ═══════════════════════════════════════════════
const Y_UPPER = [
  {key:'ones',  label:'Aces',   desc:'Sum of 1s',  opts:[0,1,2,3,4,5]},
  {key:'twos',  label:'Twos',   desc:'Sum of 2s',  opts:[0,2,4,6,8,10]},
  {key:'threes',label:'Threes', desc:'Sum of 3s',  opts:[0,3,6,9,12,15]},
  {key:'fours', label:'Fours',  desc:'Sum of 4s',  opts:[0,4,8,12,16,20]},
  {key:'fives', label:'Fives',  desc:'Sum of 5s',  opts:[0,5,10,15,20,25]},
  {key:'sixes', label:'Sixes',  desc:'Sum of 6s',  opts:[0,6,12,18,24,30]},
];
const Y_LOWER = [
  {key:'threeKind',label:'3 of a Kind',  desc:'Add all dice',  opts:[0,...Array.from({length:26},(_,i)=>i+5)]},
  {key:'fourKind', label:'4 of a Kind',  desc:'Add all dice',  opts:[0,...Array.from({length:26},(_,i)=>i+5)]},
  {key:'fullHouse',label:'Full House',   desc:'25 pts',        opts:[0,25]},
  {key:'smStr',    label:'Sm. Straight', desc:'30 pts',        opts:[0,30]},
  {key:'lgStr',    label:'Lg. Straight', desc:'40 pts',        opts:[0,40]},
  {key:'yahtzee',  label:'YAHTZEE',      desc:'50 pts',        opts:[0,50]},
  {key:'chance',   label:'Chance',       desc:'Add all dice',  opts:[0,...Array.from({length:26},(_,i)=>i+5)]},
  {key:'yBonus',   label:'Yahtzee Bonus',desc:'100 pts each',  opts:[0,50,100,150,200,250,300]},
];
const ALL_Y_CATS = [...Y_UPPER,...Y_LOWER];
function yEmptyScores(){const s={};ALL_Y_CATS.forEach(c=>s[c.key]=null);return s;}
function yUpper(sc){return Y_UPPER.reduce((a,c)=>a+(sc[c.key]??0),0);}
function yLower(sc){return Y_LOWER.reduce((a,c)=>a+(sc[c.key]??0),0);}
function yBonus(sc){return yUpper(sc)>=63?35:0;}
function yGrand(sc){return yUpper(sc)+yBonus(sc)+yLower(sc);}
function yGridCols(key){
  if(['fullHouse','smStr','lgStr','yahtzee'].includes(key)) return 'repeat(2,1fr)';
  if(key==='yBonus') return 'repeat(4,1fr)';
  if(Y_UPPER.find(c=>c.key===key)) return 'repeat(6,1fr)';
  return 'repeat(6,1fr)';
}

// ═══════════════════════════════════════════════
// YAHTZEE ACTIONS
// ═══════════════════════════════════════════════
function yRef(p){return db.ref('yahtzee/'+Y.roomCode+(p?'/'+p:''));}

async function yCreate(){
  const name = val('nameInput')||STORED_NAME;
  if(!name){flash('Enter your name!');return;}
  Y.playerName = name; STORED_NAME = name; localStorage.setItem('gn_name',name);
  const mode = Y.mode;
  let code = rndCode();
  for(let i=0;i<5;i++){const sn=await db.ref('yahtzee/'+code).once('value');if(!sn.exists())break;code=rndCode();}
  Y.roomCode=code; Y.isHost=true; Y.isScorer=true;
  await db.ref('yahtzee/'+code).set({
    hostId:PID, scorerId:PID, mode, status:'lobby', createdAt:Date.now(),
    players:{[PID]:{name,scores:yEmptyScores()}}
  });
  yListen(); goScreen('y_lobby');
}

async function yJoin(){
  const name = val('nameInput')||STORED_NAME;
  const code = val('codeInput').toUpperCase();
  if(!name){flash('Enter your name!');return;}
  if(code.length!==4){flash('Enter 4-letter room code!');return;}
  Y.playerName=name; STORED_NAME=name; localStorage.setItem('gn_name',name);
  Y.roomCode=code;
  const sn=await db.ref('yahtzee/'+code).once('value');
  if(!sn.exists()){flash('Room not found!');return;}
  const g=sn.val();
  if(g.status==='finished'){flash('Game already finished!');return;}
  await db.ref('yahtzee/'+code+'/players/'+PID).set({name,scores:yEmptyScores()});
  yListen(); goScreen('y_lobby');
}

function yListen(){
  listenTo(yRef(), sn=>{
    if(!sn.exists())return;
    Y.game=sn.val();
    Y.isHost=Y.game.hostId===PID;
    Y.isScorer=Y.game.scorerId===PID;
    Y.mode=Y.game.mode||'own';
    const t=Y.game.status==='lobby'?'y_lobby':'y_game';
    if(A.screen!==t){goScreen(t);} else {render();}
  });
}

async function yStartGame(){
  await yRef('status').set('playing');
}

function yCanEdit(pid){
  if(Y.mode==='central') return Y.isScorer;
  return pid===PID;
}

function yOpenPopup(pid,key){
  if(!yCanEdit(pid))return;
  Y.popup={pid,key};
  const cur=Y.game?.players?.[pid]?.scores?.[key];
  Y.numpadDraft=cur!=null&&cur!==0?String(cur):'';
  render();
}

function yClosePopup(){Y.popup=null;render();}

async function ySetScore(pid,key,v){
  await yRef('players/'+pid+'/scores/'+key).set(v);
  Y.popup=null; render();
}

async function yClearScore(pid,key){
  await yRef('players/'+pid+'/scores/'+key).set(null);
  Y.popup=null; render();
}

// ═══════════════════════════════════════════════
// SCATTERGORIES DATA
// ═══════════════════════════════════════════════
const SC_CATS=[
  "Animals","Boys Names","Girls Names","Countries","Cities/Towns",
  "Things in a Kitchen","Things at the Beach","Jobs/Occupations",
  "Sports","TV Shows","Movies","Foods/Drinks","Clothing Items",
  "Things in a School","Musical Instruments","Things that are Round",
  "Brands/Companies","Things in a Bedroom","Aussie Slang","Things at a BBQ",
  "Australian Places","Things in a Pub","Board/Card Games","Celebrities",
  "Things that are Hot","Things that are Cold","Vehicles","Things in a Garden",
  "Hobbies","Things at a Wedding","Colours","Things in a Bathroom",
  "Things you Drink","Things in an Office","Things at a Footy Game",
  "Things in a Hospital","Flowers/Plants","Things at Christmas",
  "Australian Animals","Songs/Bands","Things in a Gym","Furniture",
  "Things in a Handbag","Cartoon Characters","Things that Fly","Types of Transport"
];
const SC_LETTERS='ABCDEFGHIJKLMNOPRSTW'.split('');
const SC_ROUNDS=3, SC_SECS=120;

// ═══════════════════════════════════════════════
// SCATTERGORIES ACTIONS
// ═══════════════════════════════════════════════
function sRef(p){return db.ref('scattergories/'+S.roomCode+(p?'/'+p:''));}

async function sCreate(){
  const name=val('nameInput')||STORED_NAME;
  if(!name){flash('Enter your name!');return;}
  S.playerName=name; STORED_NAME=name; localStorage.setItem('gn_name',name);
  S.isHost=true;
  let code=rndCode();
  for(let i=0;i<5;i++){const sn=await db.ref('scattergories/'+code).once('value');if(!sn.exists())break;code=rndCode();}
  S.roomCode=code;
  const extraPoints=window._sExtraPoints||false;
  window._sExtraPoints=false;
  await db.ref('scattergories/'+code).set({
    hostId:PID,status:'lobby',round:0,extraPoints,createdAt:Date.now(),
    players:{[PID]:{name,totalScore:0}}
  });
  sListen(); goScreen('s_lobby');
}

async function sJoin(){
  const name=val('nameInput')||STORED_NAME;
  const code=val('codeInput').toUpperCase();
  if(!name){flash('Enter your name!');return;}
  if(code.length!==4){flash('Enter 4-letter room code!');return;}
  S.playerName=name; STORED_NAME=name; localStorage.setItem('gn_name',name);
  S.roomCode=code;
  const sn=await db.ref('scattergories/'+code).once('value');
  if(!sn.exists()){flash('Room not found!');return;}
  const g=sn.val();
  if(g.status!=='lobby'){flash('Game already started!');return;}
  await db.ref('scattergories/'+code+'/players/'+PID).set({name,totalScore:0});
  sListen(); goScreen('s_lobby');
}

function sListen(){
  listenTo(sRef(), sn=>{
    if(!sn.exists())return;
    S.game=sn.val();
    S.isHost=S.game.hostId===PID;
    const map={lobby:'s_lobby',spinning:'s_spin',answering:'s_answer',voting:'s_vote',roundEnd:'s_end',finished:'s_over'};
    const t=map[S.game.status];
    if(t&&t!==A.screen){
      if(t==='s_answer'){S.submitted=false;S.localAnswers={};}
      if(t==='s_vote'){S.localVotes={};}
      if(S.timerInt){clearInterval(S.timerInt);S.timerInt=null;}
      goScreen(t);
    } else render();
  });
}

async function sStart(){
  if(Object.keys(S.game?.players||{}).length<2){flash('Need at least 2 players!');return;}
  await sBeginRound(1);
}

async function sBeginRound(round){
  const letter=SC_LETTERS[Math.floor(Math.random()*SC_LETTERS.length)];
  const cats=pick(SC_CATS,12);
  const pids=Object.keys(S.game?.players||{});
  const upd={'status':'spinning','round':round,'letter':letter,'categories':cats,'votes':null,'votingState':{catIdx:0}};
  pids.forEach(pid=>{upd['players/'+pid+'/answers']=null;upd['players/'+pid+'/roundScore']=0;});
  await sRef().update(upd);
}

async function sBeginTimer(){await sRef().update({status:'answering',timerEnd:Date.now()+SC_SECS*1000});}

async function sSubmit(){
  const cats=S.game?.categories||[];
  const answers={};
  cats.forEach((_,i)=>{answers[i]=(($id('ans_'+i)?.value)||S.localAnswers[i]||'').trim();});
  await sRef('players/'+PID+'/answers').set(answers);
  S.submitted=true;
  if(S.timerInt){clearInterval(S.timerInt);S.timerInt=null;}
  render();
}

async function sStartVoting(){await sRef().update({status:'voting',votingState:{catIdx:0},votes:null});}

function sVote(catIdx,targetPid,vtype){
  if(!S.localVotes[catIdx])S.localVotes[catIdx]={};
  S.localVotes[catIdx][targetPid]=vtype;
  sRef('votes/'+catIdx+'/'+PID+'/'+targetPid).set(vtype);
  render();
}
// Challenge all = mark everyone else as ok, just one as challenge
function sChallenge(catIdx,targetPid){sVote(catIdx,targetPid,'challenge');}
function sOk(catIdx,targetPid){sVote(catIdx,targetPid,'ok');}

async function sNextCat(){
  const catIdx=S.game?.votingState?.catIdx||0;
  await sCalcScores(catIdx);
  if(catIdx+1>=(S.game?.categories?.length||12)){await sEndRound();}
  else{await sRef('votingState/catIdx').set(catIdx+1);}
}

function sCountLetterPts(answer, letter){
  // Count how many words start with the round letter
  const l=letter.toLowerCase();
  const words=answer.trim().split(/\s+/);
  return words.filter(w=>w[0]&&w[0].toLowerCase()===l).length||0;
}

async function sCalcScores(catIdx){
  const players=S.game?.players||{};
  const votes=S.game?.votes?.[catIdx]||{};
  const pids=Object.keys(players);
  const extraPoints=S.game?.extraPoints||false;
  const letter=S.game?.letter||'';
  const ans={};
  pids.forEach(pid=>{ans[pid]=(players[pid]?.answers?.[catIdx]||'').toLowerCase().trim();});
  // Count duplicates
  const cnt={};
  pids.forEach(pid=>{if(ans[pid])cnt[ans[pid]]=(cnt[ans[pid]]||0)+1;});
  const upd={};
  pids.forEach(pid=>{
    const a=ans[pid];if(!a)return;
    // Duplicate = 0 pts automatically
    if(cnt[a]>1){upd['players/'+pid+'/roundScore']=(players[pid]?.roundScore||0);return;}
    // Unique answer — check challenges
    const otherPids=pids.filter(p=>p!==pid);
    const challenges=otherPids.filter(voter=>votes[voter]?.[pid]==='challenge').length;
    const oks=otherPids.filter(voter=>votes[voter]?.[pid]==='ok').length;
    let accepted=true;
    if(challenges>0||oks>0){accepted=oks>challenges;}
    let pts=0;
    if(accepted){
      if(extraPoints){
        // Count words starting with the letter
        pts=sCountLetterPts(a,letter)||1; // at least 1 if accepted
      } else {
        pts=1;
      }
    }
    upd['players/'+pid+'/roundScore']=(players[pid]?.roundScore||0)+pts;
  });
  if(Object.keys(upd).length)await sRef().update(upd);
}

async function sEndRound(){
  const players=S.game?.players||{};
  const upd={};
  Object.keys(players).forEach(pid=>{
    upd['players/'+pid+'/totalScore']=(players[pid]?.totalScore||0)+(players[pid]?.roundScore||0);
  });
  upd.status=S.game.round>=SC_ROUNDS?'finished':'roundEnd';
  await sRef().update(upd);
}

async function sNextRound(){await sBeginRound(S.game.round+1);}

async function sPlayAgain(){
  const pids=Object.keys(S.game?.players||{});
  const upd={status:'lobby',round:0,letter:null,categories:null,votes:null,votingState:null};
  pids.forEach(pid=>{upd['players/'+pid+'/totalScore']=0;upd['players/'+pid+'/roundScore']=0;upd['players/'+pid+'/answers']=null;});
  await sRef().update(upd);
}

function sShare(){
  if(navigator.share){navigator.share({title:'Scattergories Night',text:'Room code: '+S.roomCode});}
  else{navigator.clipboard?.writeText(S.roomCode);flash('Code copied!');}
}

function flash(msg){const el=$id('flash');if(el){el.textContent=msg;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,2800);}}
function bindKeys(){
  [$id('nameInput'),$id('codeInput')].forEach(el=>{
    if(el)el.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        if(A.screen==='y_setup'){if(el.id==='codeInput')yJoin();else if(!val('codeInput'))yCreate();}
        if(A.screen==='s_setup'){if(el.id==='codeInput')sJoin();else if(!val('codeInput'))sCreate();}
      }
    });
  });
}

function sRunTimer(){
  if(S.timerInt)clearInterval(S.timerInt);
  S.timerInt=setInterval(()=>{
    const te=S.game?.timerEnd||0;
    const sec=Math.max(0,Math.ceil((te-Date.now())/1000));
    const el=$id('s-timer');
    if(el){
      el.textContent=`${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`;
      el.className=sec<=30?'timer urgent':'timer';
    }
    if(sec<=0){clearInterval(S.timerInt);S.timerInt=null;sSubmit();}
  },500);
}

function render(){
  const screens={hub:rHub,y_setup:rYSetup,y_lobby:rYLobby,y_game:rYGame,s_setup:rSSetup,s_lobby:rSLobby,s_spin:rSSpin,s_answer:rSAnswer,s_vote:rSVote,s_end:rSEnd,s_over:rSOver,fc_setup:rFCSetup,fc_lobby:rFCLobby,fc_game:rFCGame,qk_setup:rQKSetup,qk_lobby:rQKLobby,qk_game:rQKGame,fb_setup:rFBSetup,fb_lobby:rFBLobby,fb_entering:rFBEntering,fb_teaming:rFBTeaming,fb_team_wait:rFBTeamWait,fb_playing:rFBPlaying,fb_guessing:rFBGuessing,fb_watching:rFBWatching,fb_roundend:rFBRoundEnd,fb_finished:rFBFinished};
  $id('app').innerHTML=(screens[A.screen]||rHub)();
  bindKeys();
  if(A.screen==='s_answer')sRunTimer();
  if(A.screen==='y_game'&&Y.popup)bindPopupClose();
  if(A.screen==='fc_game'&&FC.popup){const ov=$id('fc-popup-ov');if(ov)ov.addEventListener('mousedown',e=>{if(e.target===ov)fcClosePopup();});}
  if(A.screen==='qk_game'&&QK.popup){const ov=$id('qk-popup-ov');if(ov)ov.addEventListener('mousedown',e=>{if(e.target===ov)qkClosePopup();});}
  if(['fb_playing','fb_guessing','fb_watching'].includes(A.screen)&&FB.game?.turnState?.active)fbRunTimer();
}

function bindPopupClose(){
  const ov=$id('popup-ov');
  if(ov)ov.addEventListener('mousedown',e=>{if(e.target===ov)yClosePopup();});
}

function rSVote(){
  const cats=S.game?.categories||[];
  const players=S.game?.players||{};
  const catIdx=S.game?.votingState?.catIdx||0;
  const cat=cats[catIdx]||'';
  const letter=S.game?.letter||'?';
  const pids=Object.keys(players);
  const allVotes=S.game?.votes?.[catIdx]||{};
  const ans={};
  pids.forEach(pid=>{ans[pid]=(players[pid]?.answers?.[catIdx]||'').trim();});
  // Detect duplicates (case insensitive)
  const cnt={};
  pids.forEach(pid=>{if(ans[pid])cnt[ans[pid].toLowerCase()]=(cnt[ans[pid].toLowerCase()]||0)+1;});

  return `<div class="screen">
  <div style="display:flex;align-items:center;justify-content:space-between;width:100%;max-width:500px">
    <div class="badge">Round ${S.game?.round} of ${SC_ROUNDS}</div>
    <div style="font-size:.72rem;color:var(--muted);font-weight:700">${catIdx+1} / ${cats.length} categories</div>
  </div>
  <div class="card" style="text-align:center;padding:.85rem">
    <div style="font-size:.62rem;color:var(--accent);font-weight:900;letter-spacing:.1em;text-transform:uppercase">Letter ${h(letter)} · ${h(cat)}</div>
    <div style="font-size:.68rem;color:var(--muted);margin-top:.4rem">
      Each player reads their answer aloud.<br>
      ${S.game?.extraPoints
        ?`<strong style="color:#f5a623">⭐ Extra Points mode — score = words starting with ${h(letter)}</strong><br>e.g. "Billy Bob" = 2pts if letter is ${h(letter)}`
        :`<strong style="color:#f0f0f0">Duplicate = 0pts &nbsp;·&nbsp; Unique = 1pt</strong>`}<br>
      Tap <span style="color:#ff8fa3">✗ Challenge</span> if you think it doesn't fit.
    </div>
  </div>
  <div class="card" style="padding:.8rem">
    ${pids.map(pid=>{
      const a=ans[pid];
      const isMe=pid===PID;
      const isDup=a&&cnt[a.toLowerCase()]>1;
      const myVote=S.localVotes[catIdx]?.[pid]||allVotes[PID]?.[pid];
      // Count challenges on this answer from all voters
      const challengeCount=pids.filter(voter=>voter!==pid&&(allVotes[voter]?.[pid]==='challenge'||(S.localVotes[catIdx]?.[pid]==='challenge'&&voter===PID))).length;
      return `<div class="vote-row">
        <div class="vote-left">
          <div class="vnm">${h(players[pid]?.name)}${isMe?' (you)':''}</div>
          <div class="vans" style="color:${!a?'#555':isDup?'#f5a623':'#f0f0f0'}">
            ${a?h(a):'<em style="color:#555;font-size:.8rem">no answer</em>'}
            ${isDup&&a?`<span class="dup-tag">🔁 duplicate — 0 pts</span>`:''}
            ${!isDup&&a&&S.game?.extraPoints?`<span class="dup-tag" style="background:rgba(245,166,35,.15);color:#f5a623">${sCountLetterPts(a,S.game?.letter||'')||1} pt${(sCountLetterPts(a,S.game?.letter||'')||1)>1?'s':''}</span>`:''}
            ${!isDup&&a&&challengeCount>0?`<span class="dup-tag" style="background:rgba(233,69,96,.2);color:#ff8fa3">⚡ ${challengeCount} challenge${challengeCount>1?'s':''}</span>`:''}
          </div>
        </div>
        ${!isMe&&a&&!isDup?`<div style="display:flex;gap:.32rem">
          <button class="vbtn acc ${myVote==='ok'?'on':''}" onclick="sOk(${catIdx},'${pid}')">✓</button>
          <button class="vbtn rej ${myVote==='challenge'?'on':''}" onclick="sChallenge(${catIdx},'${pid}')">✗</button>
        </div>`:`<div style="width:60px"></div>`}
      </div>`;
    }).join('')}
  </div>
  <div class="muted" style="font-size:.7rem;padding:0 .5rem">Duplicate answers are auto-detected. Challenge unique answers you think don't fit the category — majority rules, ties go against the challenger's favour.</div>
  ${S.isHost?`<button class="btn btn-gold" onclick="sNextCat()">${catIdx+1>=cats.length?'Finish Round →':'Next Category →'}</button>`:`<p class="muted">Vote then wait for host</p>`}
</div>`;
}

function rSEnd(){
  const round=S.game?.round||1;
  const ps=S.game?.players||{};

function rSOver(){

}

let FC = {
  roomCode:null,playerName:'',isHost:false,isScorer:false,
  mode:'own',game:null,popup:null,popupDraft:'',addingPlayer:false
};

function fcEmptyRounds(){const r={};FC_ROUNDS.forEach((_,i)=>r[i]=null);return r;}
function fcTotal(rounds){return Object.values(rounds||{}).reduce((a,v)=>a+(v??0),0);}

function fcRef(p){return db.ref('fivecrowns/'+FC.roomCode+(p?'/'+p:''));}

async function fcCreate(){
  const name=val('nameInput')||STORED_NAME;
  if(!name){flash('Enter your name!');return;}
  FC.playerName=name;STORED_NAME=name;localStorage.setItem('gn_name',name);
  const mode=FC.mode;FC.isHost=true;FC.isScorer=true;
  let code=rndCode();
  for(let i=0;i<5;i++){const sn=await db.ref('fivecrowns/'+code).once('value');if(!sn.exists())break;code=rndCode();}
  FC.roomCode=code;
  await db.ref('fivecrowns/'+code).set({
    hostId:PID,scorerId:PID,mode,status:'lobby',createdAt:Date.now(),
    players:{[PID]:{name,rounds:fcEmptyRounds()}}
  });
  fcListen();goScreen('fc_lobby');
}

async function fcJoin(){
  const name=val('nameInput')||STORED_NAME;
  const code=val('codeInput').toUpperCase();
  if(!name){flash('Enter your name!');return;}
  if(code.length!==4){flash('Enter 4-letter room code!');return;}
  FC.playerName=name;STORED_NAME=name;localStorage.setItem('gn_name',name);
  FC.roomCode=code;
  const sn=await db.ref('fivecrowns/'+code).once('value');
  if(!sn.exists()){flash('Room not found!');return;}
  await db.ref('fivecrowns/'+code+'/players/'+PID).set({name,rounds:fcEmptyRounds()});
  fcListen();goScreen('fc_lobby');
}

function fcListen(){
  listenTo(fcRef(),sn=>{
    if(!sn.exists())return;
    FC.game=sn.val();
    FC.isHost=FC.game.hostId===PID;
    FC.isScorer=FC.game.scorerId===PID;
    FC.mode=FC.game.mode||'own';
    const t=FC.game.status==='lobby'?'fc_lobby':'fc_game';
    if(A.screen!==t){goScreen(t);}else{render();}
  });
}

async function fcStartGame(){await fcRef('status').set('playing');}

function fcCanEdit(pid){
  if(FC.mode==='central')return FC.isScorer;
  return pid===PID;
}

function fcOpenPopup(pid,roundIdx){
  if(!fcCanEdit(pid))return;
  FC.popup={pid,roundIdx};
  const cur=FC.game?.players?.[pid]?.rounds?.[roundIdx];
  FC.popupDraft=cur!=null?String(cur):'';
  render();
}
function fcClosePopup(){FC.popup=null;render();}

async function fcSetScore(pid,roundIdx,v){
  await fcRef('players/'+pid+'/rounds/'+roundIdx).set(v);
  FC.popup=null;render();
}

async function fcClearScore(pid,roundIdx){
  await fcRef('players/'+pid+'/rounds/'+roundIdx).set(null);
  FC.popup=null;render();
}

function rFCGame(){
  const players=FC.game?.players||{};
  const pids=Object.keys(players);
  const totals=pids.map(pid=>fcTotal(players[pid]?.rounds||{}));
  const anyScore=pids.some(pid=>Object.values(players[pid]?.rounds||{}).some(v=>v!=null));
  const minTotal=anyScore?Math.min(...totals):null;

  let html=`<div class="screen" style="padding:0;gap:0">`;

  // Top bar
  html+=`<div style="width:100%;background:#0f0f1a;padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.06)">
    <button class="back-btn" style="flex-shrink:0" onclick="goHub()">← Hub</button>
    <span class="title" style="font-size:1.2rem;flex:1;text-align:center;background:linear-gradient(135deg,#c8a4ff,#4cc9f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🃏 5 Crowns</span>
    <span class="badge">${FC.mode==='central'?(FC.isScorer?'Scoring':'Watching'):'Own Device'}</span>
  </div>`;

  html+=`<div style="width:100%;padding:.5rem;overflow:hidden"><div class="y-scroll">`;
  html+=`<table class="y-table"><thead class="y-thead"><tr>`;
  html+=`<th class="sticky-col" style="min-width:110px;text-align:left;padding-left:.7rem">Round</th>`;
  pids.forEach((pid,i)=>{
    const isLeader=anyScore&&totals[i]===minTotal;
    html+=`<th style="min-width:72px${isLeader?';background:#1a3a10':''};">${h(players[pid]?.name||'')}${isLeader?' 🏆':''}</th>`;
  });
  html+=`</tr></thead><tbody>`;

  FC_ROUNDS.forEach((rd,ri)=>{
    const alt=ri%2===1?'y-alt':'';
    html+=`<tr class="${alt}"><td class="y-cat-td" style="min-width:110px">
      <div class="y-cat-name">Round ${rd.r}</div>
      <div class="y-cat-desc">${rd.wild} wild · ${rd.cards} cards</div>
    </td>`;
    pids.forEach(pid=>{
      const v=players[pid]?.rounds?.[ri]??null;
      const canEdit=fcCanEdit(pid);
      const isEmpty=v==null;
      html+=`<td class="y-score-td"><div class="cell-tap ${canEdit?'can':'ro'} ${isEmpty?'empty':'scored'}"
        onclick="${canEdit?`fcOpenPopup('${pid}',${ri})`:''}">
        ${isEmpty?'—':v}
      </div></td>`;
    });
    html+=`</tr>`;
  });

  // Totals row

      <button class="p-cancel" style="border-color:rgba(255,255,255,.15);color:#666" onclick="fcClosePopup()">Cancel</button>
    </div></div>`;
    // Close on overlay tap
  }

  html+=`</div>`;
  return html;
}

let QK = {
  roomCode:null,playerName:'',isHost:false,isScorer:false,
  mode:'own',game:null,popup:null,numpadDraft:'',addingPlayer:false
};

function qkTotal(turns){return Object.values(turns||{}).reduce((a,v)=>a+(v||0),0);}
function qkLastTurn(turns){
  const entries=Object.entries(turns||{});
  return entries.length?entries[entries.length-1][1]:null;
}

// QWIRKLE FIREBASE
// ═══════════════════════════════════════════════
function qkRef(p){return db.ref('qwirkle/'+QK.roomCode+(p?'/'+p:''));}

async function qkCreate(){
  const name=val('nameInput')||STORED_NAME;
  if(!name){flash('Enter your name!');return;}
  QK.playerName=name;STORED_NAME=name;localStorage.setItem('gn_name',name);
  QK.isHost=true;QK.isScorer=true;
  const mode=QK.mode;
  let code=rndCode();
  for(let i=0;i<5;i++){const sn=await db.ref('qwirkle/'+code).once('value');if(!sn.exists())break;code=rndCode();}
  QK.roomCode=code;
  await db.ref('qwirkle/'+code).set({
    hostId:PID,scorerId:PID,mode,status:'lobby',createdAt:Date.now(),
    players:{[PID]:{name,turns:{}}}
  });
  qkListen();goScreen('qk_lobby');
}

async function qkJoin(){
  const name=val('nameInput')||STORED_NAME;
  const code=val('codeInput').toUpperCase();
  if(!name){flash('Enter your name!');return;}
  if(code.length!==4){flash('Enter 4-letter room code!');return;}
  QK.playerName=name;STORED_NAME=name;localStorage.setItem('gn_name',name);
  QK.roomCode=code;
  const sn=await db.ref('qwirkle/'+code).once('value');
  if(!sn.exists()){flash('Room not found!');return;}
  await db.ref('qwirkle/'+code+'/players/'+PID).set({name,turns:{}});
  qkListen();goScreen('qk_lobby');
}

function qkListen(){
  listenTo(qkRef(),sn=>{
    if(!sn.exists())return;
    QK.game=sn.val();
    QK.isHost=QK.game.hostId===PID;
    QK.isScorer=QK.game.scorerId===PID;
    QK.mode=QK.game.mode||'own';
    const t=QK.game.status==='lobby'?'qk_lobby':'qk_game';
    if(A.screen!==t){goScreen(t);}else{render();}
  });
}

async function qkStartGame(){await qkRef('status').set('playing');}

function qkCanEdit(pid){
  if(QK.mode==='central')return QK.isScorer;
  return pid===PID;
}

function qkOpenPopup(pid){
  if(!qkCanEdit(pid))return;
  QK.popup={pid};QK.numpadDraft='';render();
}
function qkClosePopup(){QK.popup=null;render();}

function qkNumpad(d){
  if(d==='back') QK.numpadDraft=QK.numpadDraft.slice(0,-1);
  else if(QK.numpadDraft.length<3) QK.numpadDraft+=d;
  const el=document.getElementById('qk-np-disp');
  if(el) el.textContent=QK.numpadDraft||'—';
}

async function qkNumpadOk(pid){
  const v=parseInt(QK.numpadDraft,10);
  if(isNaN(v)||v<0){flash('Enter a score first!');return;}
  await qkAddScore(pid,v);
}

async function qkAddScore(pid,pts){
  const turns=QK.game?.players?.[pid]?.turns||{};
  const nextIdx=Object.keys(turns).length;
  await qkRef('players/'+pid+'/turns/'+nextIdx).set(pts);
  QK.popup=null;render();
}

async function qkUndo(pid){
  const turns=QK.game?.players?.[pid]?.turns||{};
  const keys=Object.keys(turns);
  if(!keys.length)return;
  const lastKey=keys[keys.length-1];
  await qkRef('players/'+pid+'/turns/'+lastKey).remove();
  QK.popup=null;render();
}

async function qkReset(){
  if(!confirm('Reset all scores?'))return;
  const pids=Object.keys(QK.game?.players||{});
  const upd={};
  pids.forEach(pid=>upd['players/'+pid+'/turns']={});
  await qkRef().update(upd);
}

function rQKGame(){
  const players=QK.game?.players||{};
  const pids=Object.keys(players);
  const totals=pids.map(pid=>qkTotal(players[pid]?.turns));
  const maxTotal=Math.max(...totals,0);
  const anyScore=totals.some(t=>t>0);

  let html=`<div class="screen" style="padding:0;gap:0">`;

  // Top bar
  html+=`<div style="width:100%;background:#0f0f1a;padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.06)">

    const total=totals[i];
    const last=qkLastTurn(p?.turns);

    const canEdit=qkCanEdit(pid);
    html+=`<div onclick="${canEdit?`qkOpenPopup('${pid}')`:''}"
      style="background:${isLeader?'rgba(15,155,88,.18)':'rgba(255,255,255,.05)'};border:2px solid ${isLeader?'rgba(15,155,88,.5)':'rgba(255,255,255,.08)'};border-radius:16px;padding:1rem .75rem;text-align:center;cursor:${canEdit?'pointer':'default'};user-select:none;transition:transform .12s;-webkit-tap-highlight-color:transparent"
      ontouchstart="this.style.transform='scale(.97)'" ontouchend="this.style.transform='scale(1)'">
      ${isLeader?`<div style="font-size:.6rem;font-weight:900;color:#5eff9e;letter-spacing:.06em;margin-bottom:.15rem">👑 LEADING</div>`:`<div style="min-height:1rem"></div>`}
      <div style="font-size:.85rem;font-weight:800;color:${isLeader?'#5eff9e':'var(--text)'};margin-bottom:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h(p?.name||'')}</div>
      <div style="font-size:3rem;font-weight:900;color:${isLeader?'#5eff9e':'var(--gold)'};line-height:1.05;margin:.15rem 0">${total}</div>

    </div>`;
  });
  html+=`</div>`;

  // Score history (last 5 turns across all players)
  const allTurns=[];
  pids.forEach(pid=>{
    const turns=players[pid]?.turns||{};
    Object.entries(turns).forEach(([idx,pts])=>{
      allTurns.push({name:players[pid]?.name,pts,idx:parseInt(idx)});

  if(allTurns.length){
    const recent=allTurns.sort((a,b)=>b.idx-a.idx).slice(0,6);
    html+=`<div style="width:100%;padding:0 .75rem .75rem">
    <div style="font-size:.65rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem">Recent Turns</div>

    </div></div>`;
  }

  // Popup
  if(QK.popup){
    const {pid}=QK.popup;
    const p=players[pid];
    const last=qkLastTurn(p?.turns);
    html+=`<div class="popup-ov" id="qk-popup-ov">
    <div class="popup-bx" style="background:#1a1a2e;border:1px solid rgba(76,201,240,.25)">
      <div class="popup-ttl" style="color:#f0f0f0">${h(p?.name)}'s Turn</div>
      <div class="popup-dsc" style="color:#888">Total so far: ${qkTotal(p?.turns)} pts</div>

      <div id="qk-np-disp" style="background:rgba(76,201,240,.1);border-radius:8px;padding:.3rem;text-align:center;font-size:2.2rem;font-weight:900;color:#f0f0f0;margin-bottom:.52rem;min-height:2.7rem;letter-spacing:.05em">${QK.numpadDraft||'—'}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:.4rem">
        ${[7,8,9,4,5,6,1,2,3].map(n=>`<button class="p-btn" style="font-size:1.05rem;padding:.62rem 0;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#f0f0f0" onclick="qkNumpad('${n}')">${n}</button>`).join('')}

        <button class="p-btn" style="font-size:1.05rem;padding:.62rem 0;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#f0f0f0" onclick="qkNumpad('0')">0</button>
        <button class="p-btn" style="background:#0f9b58;color:#fff;border-color:#0f9b58;font-size:1.15rem;padding:.62rem 0" onclick="qkNumpadOk('${pid}')">✓</button>
      </div>
      ${last!=null?`<button class="p-btn" style="color:#888;font-size:.72rem;margin-bottom:.35rem;width:100%;background:transparent;border-color:rgba(255,255,255,.1)" onclick="qkUndo('${pid}')">↩ Undo last turn (+${last})</button>`:''}

    </div></div>`;
  }

  html+=`</div>`;
  return html;
}

// FISHBOWL
// ═══════════════════════════════════════════════
const FB_ROUND_NAMES=['📢 Describe it','💬 One Word','🎭 Act it out'];
const FB_WORDS_EACH=5;
const TEAM_COLS=['#e94560','#4cc9f0','#0f9b58','#f5a623'];

let FB={roomCode:null,playerName:'',isHost:false,game:null,timerInt:null,localWords:{}};

function fbRef(p){return db.ref('fishbowl/'+FB.roomCode+(p?'/'+p:''));}
function fbActivePid(){
  const g=FB.game;if(!g)return null;
  const t=g.teams?.[g.currentTeamIdx];if(!t)return null;
  const m=t.playerIds||[];if(!m.length)return null;
  return m[(t.currentMemberIdx||0)%m.length];
}
function fbMyTeam(){return FB.game?.players?.[PID]?.teamIdx??-1;}
function fbIAmActive(){return fbActivePid()===PID;}
function fbMyTeamActive(){const g=FB.game;return g&&fbMyTeam()===g.currentTeamIdx;}

async function fbCreate(){
  const name=val('nameInput')||STORED_NAME;
  if(!name){flash('Enter your name!');return;}
  FB.playerName=name;STORED_NAME=name;localStorage.setItem('gn_name',name);
  FB.isHost=true;
  let code=rndCode();
  for(let i=0;i<5;i++){const sn=await db.ref('fishbowl/'+code).once('value');if(!sn.exists())break;code=rndCode();}
  FB.roomCode=code;
  const nt=parseInt(document.querySelector('input[name=nteams]:checked')?.value||2);
  const ts=parseInt(document.querySelector('input[name=tsecs]:checked')?.value||60);
  const teams={};
  for(let i=0;i<nt;i++)teams[i]={name:'Team '+(i+1),playerIds:[],currentMemberIdx:0,scores:{1:0,2:0,3:0}};
  await db.ref('fishbowl/'+code).set({
    hostId:PID,status:'lobby',numTeams:nt,timerSecs:ts,createdAt:Date.now(),teams,
    players:{[PID]:{name,teamIdx:-1,wordsSubmitted:false}}
  });
  fbListen();goScreen('fb_lobby');
}

async function fbJoin(){
  const name=val('nameInput')||STORED_NAME;
  const code=val('codeInput').toUpperCase();
  if(!name){flash('Enter your name!');return;}
  if(code.length!==4){flash('Enter 4-letter room code!');return;}
  FB.playerName=name;STORED_NAME=name;localStorage.setItem('gn_name',name);
  FB.roomCode=code;
  const sn=await db.ref('fishbowl/'+code).once('value');
  if(!sn.exists()){flash('Room not found!');return;}
  await db.ref('fishbowl/'+code+'/players/'+PID).set({name,teamIdx:-1,wordsSubmitted:false});
  fbListen();goScreen('fb_lobby');
}

function fbListen(){
  listenTo(fbRef(),sn=>{
    if(!sn.exists())return;
    FB.game=sn.val();FB.isHost=FB.game.hostId===PID;
    const g=FB.game,st=g.status;
    const was=A.screen;
    if(st==='lobby'&&was!=='fb_lobby')goScreen('fb_lobby');
    else if(st==='entering'&&was!=='fb_entering')goScreen('fb_entering');
    else if(st==='teaming'){const t=FB.isHost?'fb_teaming':'fb_team_wait';if(was!==t)goScreen(t);}
    else if(st==='playing'){
      let t;
      if(fbIAmActive())t='fb_playing';
      else if(fbMyTeamActive())t='fb_guessing';
      else t='fb_watching';
      if(was!==t)goScreen(t);else render();
    }
    else if(st==='roundEnd'&&was!=='fb_roundend')goScreen('fb_roundend');
    else if(st==='finished'&&was!=='fb_finished')goScreen('fb_finished');
    else render();
  });
}

async function fbStartEntering(){await fbRef('status').set('entering');}

async function fbSubmitWords(){
  const words={};
  for(let i=0;i<FB_WORDS_EACH;i++){
    const w=(FB.localWords[i]||'').trim();
    if(!w){flash('Fill in word '+(i+1)+'!');return;}
    words[i]=w;
  }
  await fbRef('players/'+PID).update({words,wordsSubmitted:true});
  render();
}

async function fbStartTeaming(){
  const players=FB.game?.players||{};
  const allDone=Object.values(players).every(p=>p.wordsSubmitted);
  if(!allDone&&!confirm('Not everyone has submitted words. Continue anyway?'))return;
  await fbRef('status').set('teaming');
}

async function fbAutoAssign(){
  const pids=Object.keys(FB.game?.players||{});
  const shuffled=[...pids].sort(()=>Math.random()-.5);
  const nt=FB.game?.numTeams||2;
  const upd={};const ta={};
  for(let t=0;t<nt;t++)ta[t]=[];
  shuffled.forEach((pid,i)=>{const t=i%nt;upd['players/'+pid+'/teamIdx']=t;ta[t].push(pid);});
  for(let t=0;t<nt;t++)upd['teams/'+t+'/playerIds']=ta[t];
  await fbRef().update(upd);
}

async function fbAssignPlayer(pid,toTeam){
  const g=FB.game;const nt=g.numTeams||2;
  const oldTeam=g.players[pid]?.teamIdx??-1;
  const upd={['players/'+pid+'/teamIdx']:toTeam};
  for(let t=0;t<nt;t++){
    let arr=[...(g.teams[t]?.playerIds||[])];
    if(t===oldTeam)arr=arr.filter(p=>p!==pid);
    if(t===toTeam&&!arr.includes(pid))arr.push(pid);
    upd['teams/'+t+'/playerIds']=arr;
  }
  await fbRef().update(upd);
}

async function fbStartGame(){
  const g=FB.game;const players=g.players||{};
  if(Object.values(players).some(p=>p.teamIdx<0)){flash('Assign all players to a team!');return;}
  const allWords={};
  Object.entries(players).forEach(([pid,p])=>{
    Object.entries(p.words||{}).forEach(([idx,word])=>{allWords[pid+'_'+idx]={word};});
  });
  const nt=g.numTeams||2;
  const upd={status:'playing',round:1,currentTeamIdx:0,bowl:{...allWords},allWords,
    turnState:{active:false,timerEnd:0,currentWordId:null,gotIds:{}}};
  for(let t=0;t<nt;t++){upd['teams/'+t+'/scores']={1:0,2:0,3:0};upd['teams/'+t+'/currentMemberIdx']=0;}
  await fbRef().update(upd);
}

async function fbStartTurn(){
  const bowl=FB.game?.bowl||{};
  const ids=Object.keys(bowl);if(!ids.length)return;
  const wordId=ids[Math.floor(Math.random()*ids.length)];
  await fbRef('turnState').update({active:true,timerEnd:Date.now()+(FB.game?.timerSecs||60)*1000,currentWordId:wordId,gotIds:{}});
}

async function fbGotWord(){
  const g=FB.game;const ts=g.turnState||{};
  const wordId=ts.currentWordId;if(!wordId)return;
  const gotIds={...(ts.gotIds||{})};gotIds[wordId]=true;
  const bowl={...(g.bowl||{})};delete bowl[wordId];
  const remaining=Object.keys(bowl);
  const teamIdx=g.currentTeamIdx;const round=g.round;
  const curScore=g.teams?.[teamIdx]?.scores?.[round]||0;
  const newScore=curScore+Object.keys(gotIds).length;
  if(!remaining.length){
    const upd={bowl,['teams/'+teamIdx+'/scores/'+round]:newScore,
      'turnState/active':false,'turnState/currentWordId':null,'turnState/gotIds':gotIds};
    upd.status=round>=3?'finished':'roundEnd';
    await fbRef().update(upd);
  } else {
    const nextId=remaining[Math.floor(Math.random()*remaining.length)];
    await fbRef().update({['bowl/'+wordId]:null,'turnState/currentWordId':nextId,'turnState/gotIds':gotIds});
  }
}

async function fbSkipWord(){
  const g=FB.game;const ts=g.turnState||{};
  const wordId=ts.currentWordId;if(!wordId)return;
  const others=Object.keys(g.bowl||{}).filter(id=>id!==wordId);
  if(!others.length)return;
  await fbRef('turnState/currentWordId').set(others[Math.floor(Math.random()*others.length)]);
}

async function fbEndTurn(){
  const g=FB.game;if(!g?.turnState?.active)return;
  const gotIds=g.turnState.gotIds||{};
  const numGot=Object.keys(gotIds).length;
  const teamIdx=g.currentTeamIdx;const round=g.round;
  const nt=g.numTeams||2;
  const members=g.teams?.[teamIdx]?.playerIds||[];
  const curMember=g.teams?.[teamIdx]?.currentMemberIdx||0;
  const curScore=g.teams?.[teamIdx]?.scores?.[round]||0;
  const upd={
    'turnState/active':false,'turnState/currentWordId':null,
    currentTeamIdx:(teamIdx+1)%nt,
    ['teams/'+teamIdx+'/scores/'+round]:curScore+numGot,
    ['teams/'+teamIdx+'/currentMemberIdx']:(curMember+1)%Math.max(1,members.length)
  };
  await fbRef().update(upd);
}

async function fbNextRound(){
  const g=FB.game;const nt=g.numTeams||2;
  const upd={status:'playing',round:g.round+1,bowl:{...g.allWords},currentTeamIdx:0,
    turnState:{active:false,timerEnd:0,currentWordId:null,gotIds:{}}};
  for(let t=0;t<nt;t++){
    const m=g.teams?.[t]?.playerIds||[];
    upd['teams/'+t+'/currentMemberIdx']=(((g.teams?.[t]?.currentMemberIdx||0))+1)%Math.max(1,m.length);
  }
  await fbRef().update(upd);
}

function fbRunTimer(){
  if(FB.timerInt)clearInterval(FB.timerInt);
  FB.timerInt=setInterval(()=>{
    const te=FB.game?.turnState?.timerEnd||0;
    const sec=Math.max(0,Math.ceil((te-Date.now())/1000));
    const el=$id('fb-timer');
    if(el){el.textContent=sec;el.style.color=sec<=10?'#e94560':sec<=20?'#f5a623':'#4cc9f0';}
    if(sec<=0){clearInterval(FB.timerInt);FB.timerInt=null;if(fbIAmActive())fbEndTurn();}
  },250);
}

  const sorted=[...totals].sort((a,b)=>b-a);
  return `<div class="screen">
  <h1 class="title" style="background:linear-gradient(135deg,#e8a0ff,#e94560);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Game Over!</h1>
  <div style="text-align:center"><div style="font-size:4rem">🏆</div>
    <div style="font-size:1.8rem;font-weight:900;color:${TEAM_COLS[wi]}">${h(g.teams?.[wi]?.name||'Team '+(wi+1))}</div>
    <p class="muted">wins with ${maxT} points!</p>
  </div>
  <div class="card w500">
    <div style="font-size:.65rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem">Final Scores</div>
    ${Array.from({length:nt},(_,t)=>{const tm=g.teams?.[t]||{};const rank=sorted.indexOf(totals[t]);
    return `<div class="sc-score-row">
      <div><span style="margin-right:.3rem">${medals[rank]||''}</span><span style="font-weight:800;color:${TEAM_COLS[t]}">${h(tm.name)}</span>
      <div style="font-size:.68rem;color:var(--muted)">R1:${tm.scores?.[1]||0} · R2:${tm.scores?.[2]||0} · R3:${tm.scores?.[3]||0}</div></div>
      <div class="sc-pts">${totals[t]}</div>
    </div>`;}).join('')}
  </div>
  <button class="btn btn-ghost w500" onclick="goHub()">← Back to Games</button>
</div>`;
}


// ═══════════════════════════════════════════════
// MANUAL PLAYER MANAGEMENT (central scorer mode)
// ═══════════════════════════════════════════════
function manualPid(){return 'm_'+Math.random().toString(36).substr(2,6);}

async function yAddPlayer(){
  const name=val('new-player-name').trim();
  if(!name){flash('Enter a name!');return;}
  const pid=manualPid();
  await db.ref('yahtzee/'+Y.roomCode+'/players/'+pid).set({name,scores:yEmptyScores(),manual:true});
  Y.addingPlayer=false;render();
}
async function yRemovePlayer(pid){
  if(pid===PID)return;
  await db.ref('yahtzee/'+Y.roomCode+'/players/'+pid).remove();
}

async function fcAddPlayer(){
  const name=val('new-player-name').trim();
  if(!name){flash('Enter a name!');return;}
  const pid=manualPid();
  await db.ref('fivecrowns/'+FC.roomCode+'/players/'+pid).set({name,rounds:fcEmptyRounds(),manual:true});
  FC.addingPlayer=false;render();
}
async function fcRemovePlayer(pid){
  if(pid===PID)return;
  await db.ref('fivecrowns/'+FC.roomCode+'/players/'+pid).remove();
}

async function qkAddPlayer(){
  const name=val('new-player-name').trim();
  if(!name){flash('Enter a name!');return;}
  const pid=manualPid();
  await db.ref('qwirkle/'+QK.roomCode+'/players/'+pid).set({name,turns:{},manual:true});
  QK.addingPlayer=false;render();
}
async function qkRemovePlayer(pid){
  if(pid===PID)return;
  await db.ref('qwirkle/'+QK.roomCode+'/players/'+pid).remove();
}

function addPlayerRow(onAdd, onCancel){
  return `<div style="display:flex;gap:.4rem;margin-top:.5rem;align-items:center">
    <input id="new-player-name" placeholder="Player name..." autocomplete="off"
      style="flex:1;padding:.55rem .8rem;font-size:.88rem"
      onkeydown="if(event.key==='Enter')${onAdd}"/>
    <button onclick="${onAdd}" style="background:var(--green);color:#fff;border:none;border-radius:8px;padding:.55rem .9rem;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;font-size:.85rem;flex-shrink:0">Add</button>
    <button onclick="${onCancel}" style="background:rgba(255,255,255,.08);color:var(--muted);border:none;border-radius:8px;padding:.55rem .7rem;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;flex-shrink:0">✕</button>
  </div>`;
}

// ═══════════════════════════════════════════════
// NUMPAD HELPERS
// ═══════════════════════════════════════════════
function yNumpad(d){
  if(d==='back') Y.numpadDraft=Y.numpadDraft.slice(0,-1);
  else if(Y.numpadDraft.length<3) Y.numpadDraft+=d;
  const el=document.getElementById('y-np-disp');
  if(el) el.textContent=Y.numpadDraft||'—';
}
function yNumpadOk(pid,key){
  const v=parseInt(Y.numpadDraft,10);
  if(!isNaN(v)&&v>=0) ySetScore(pid,key,v);
  else yClosePopup();
}
function fcNumpad(d){
  if(d==='back') FC.popupDraft=FC.popupDraft.slice(0,-1);
  else if(FC.popupDraft.length<3) FC.popupDraft+=d;
  const el=document.getElementById('fc-np-disp');
  if(el) el.textContent=FC.popupDraft||'—';
}
function fcNumpadOk(pid,roundIdx){
  const v=parseInt(FC.popupDraft,10);
  if(!isNaN(v)&&v>=0) fcSetScore(pid,roundIdx,v);
  else fcClosePopup();
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
render();
</script>
